# Overlay that bundles nginx INTO the docker stack (reverse proxy in front of
# both apps). Use when you do NOT have a host nginx to add the site to.
#
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
#
# Binds the public port to a chosen host interface + port:
#   INTERFACE  host interface/IP to bind (default 0.0.0.0 = all)
#   PORT       host port to expose (default 8080)
# nginx reaches the apps over the internal compose network by service name,
# so the loopback ports published by the base file stay unused here (harmless).
services:
  # Suppress the loopback ports from the base file — nginx is the only entry point.
  fakecaptcha:
    ports: !override []
  client:
    ports: !override []

  nginx:
    image: nginx:alpine
    ports:
      - "${INTERFACE:-0.0.0.0}:${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fakecaptcha
      - client
    restart: unless-stopped
