# In-Docker nginx config (used by docker-compose.nginx.yml).
# Upstreams are the compose SERVICE names, reachable on the internal network.
# For the host-nginx variant instead, see nginx/nginx.conf (loopback upstreams).

upstream fakecaptcha {
    server fakecaptcha:8080;
}

upstream client {
    server client:5000;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── FakeCaptcha routes ──
    location = /captcha          { proxy_pass http://fakecaptcha; }
    location = /sdk.js           { proxy_pass http://fakecaptcha; }
    location = /check-captcha    { proxy_pass http://fakecaptcha; }
    location = /s               { proxy_pass http://fakecaptcha; }
    location = /dashboard        { proxy_pass http://fakecaptcha; }
    location ^~ /equipo/         { proxy_pass http://fakecaptcha; }

    location = /datos {
        proxy_pass http://fakecaptcha;
        proxy_set_header Content-Type $http_content_type;
    }

    # ── Client (default) ──
    location / {
        proxy_pass http://client;
    }
}
