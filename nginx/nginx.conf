# Host nginx site snippet for FakeCaptcha (NOT run in Docker).
# Drop into the existing nginx (e.g. /etc/nginx/conf.d/fakecaptcha.conf or a
# sites-available symlink) alongside the other sites this server already hosts,
# then `nginx -t && systemctl reload nginx`.
#
# The two Flask apps run via docker-compose, published on loopback only:
#   fakecaptcha -> 127.0.0.1:8080   (FAKECAPTCHA_PORT)
#   client      -> 127.0.0.1:5000   (CLIENT_PORT)

upstream fakecaptcha {
    server 127.0.0.1:8080;
}

upstream fc_client {
    server 127.0.0.1:5000;
}

server {
    # TLS/listen handled by this host's existing nginx setup; set the real name.
    listen 80;
    server_name fakecaptcha.example.com;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── FakeCaptcha routes ──
    location = /captcha          { proxy_pass http://fakecaptcha; }
    location = /sdk.js           { proxy_pass http://fakecaptcha; }
    location = /check-captcha    { proxy_pass http://fakecaptcha; }
    location = /s               { proxy_pass http://fakecaptcha; }
    location = /dashboard        { proxy_pass http://fakecaptcha; }
    location ^~ /equipo/         { proxy_pass http://fakecaptcha; }

    location = /datos {
        proxy_pass http://fakecaptcha;
        proxy_set_header Content-Type $http_content_type;
    }

    # ── Client (default) ──
    location / {
        proxy_pass http://fc_client;
    }
}
